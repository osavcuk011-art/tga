<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogiFlow Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #f4f4f5);
            color: var(--tg-theme-text-color, #1c1c1e);
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
        }
        h2 { text-align: center; margin-top: 0; }
        .section {
            background: var(--tg-theme-secondary-bg-color, #ffffff);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        label { font-weight: bold; font-size: 14px; display: block; margin-bottom: 4px; }
        input, textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
        }
        button {
            background-color: var(--tg-theme-button-color, #007aff);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 8px;
        }
        button.secondary {
            background-color: #e5e5ea;
            color: #000;
        }
    </style>
</head>
<body>

    <h2>🚛 LogiFlow Panel</h2>

    <div class="section">
        <h3>📦 Нове замовлення</h3>
        <label>Звідки:</label>
        <input type="text" id="from_addr" placeholder="Місто, вулиця">
        
        <label>Куди:</label>
        <input type="text" id="to_addr" placeholder="Місто, вулиця">
        
        <label>Опис вантажу:</label>
        <textarea id="desc" rows="2" placeholder="Що веземо, вага"></textarea>
        
        <button onclick="createOrder()">Надіслати замовлення</button>
    </div>

    <div class="section">
        <h3>🚛 Меню Шофера</h3>
        <button onclick="shareLocation()">📍 Надіслати мої координати</button>
    </div>

    <div class="section">
        <h3>✍️ Зв'язок з адміністрацією</h3>
        <textarea id="msg_text" rows="2" placeholder="Ваше запитання або повідомлення"></textarea>
        <button class="secondary" onclick="sendMessage()">Надіслати повідомлення</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        function sendToBot(action, payload) {
            const data = { action: action, payload: payload };
            tg.sendData(JSON.stringify(data));
        }

        function createOrder() {
            const from = document.getElementById('from_addr').value;
            const to = document.getElementById('to_addr').value;
            const desc = document.getElementById('desc').value;

            if (!from || !to) {
                alert("Будь ласка, вкажіть пункти відправки та доставки!");
                return;
            }

            sendToBot("create_order", { from: from, to: to, desc: desc });
        }

        function shareLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition((pos) => {
                    sendToBot("share_location", {
                        lat: pos.coords.latitude,
                        lon: pos.coords.longitude
                    });
                }, () => {
                    alert("Не вдалося отримати геопозицію. Увімкніть GPS.");
                });
            } else {
                alert("Геолокація не підтримується вашим пристроєм.");
            }
        }

        function sendMessage() {
            const text = document.getElementById('msg_text').value;
            if (!text) return;
            sendToBot("contact_admin", { text: text });
        }
    </script>
</body>
</html>
